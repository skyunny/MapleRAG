[project]
name = "maplerag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12.6"
dependencies = [
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langchain-anthropic>=1.7.10",
    "langchain-text-splitters>=1.1.3",
    "langfuse>=5.2.0",
    "langgraph>=1.2.20",
    "neo4j>=6.4.1",
    "pydantic>=2.14.3",
    "pyshacl>=0.40.2",
    "python-dotenv>=1.2.4",
    "rdflib>=7.6.0",
]

[project.scripts]
maplerag = "maplerag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
